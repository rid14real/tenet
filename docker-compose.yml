# Local or single-server deployment: PostgreSQL plus the Tenet app on http://localhost:4000.
# Copy .env.example to .env and set real passwords first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenet
      POSTGRES_USER: tenet_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenet_owner -d tenet"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tenet_app:${APP_DB_PASSWORD}@db:5432/tenet
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-first-run}
      NODE_ENV: production
    ports:
      - "4000:4000"
volumes:
  db:
